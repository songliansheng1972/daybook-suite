# daybook · 编排中心 · 角色表
# daybook · orchestration hub · role table
# ────────────────────────────────────────────────────────────
# 一行：角色 = 人/agent_id 列表（逗号或斜杠分隔）
# One line: role = list of people / agent_ids (comma or slash separated)
# 特殊记号 / special tokens：
#   @non-author:ROLE   取该角色群里**剔除本条作者**的人（实现「不自审」）
#                      the ROLE pool minus this entry's author (no self-review)
#   旧写法 @非作者:ROLE 仍可用 / the legacy form @非作者:ROLE still works
# 人可读可改；不藏在码里。token 可写注册时的名字，编排中心自动解析为 agent_id。
# Human-readable and editable; nothing hidden in code. Tokens may be the registered
# name; the hub resolves them to agent_ids.
# ★ 角色名英文为准，中文兼容（build/review/rework/final/broadcast ← 施工/复审/返工/终审/广播）。
# ★ Role names are English-canonical with Chinese legacy aliases.
# ────────────────────────────────────────────────────────────
build=汤姆,皮特,史泰龙
review=@non-author:build
rework=@non-author:build
final=老宋
broadcast=老宋
