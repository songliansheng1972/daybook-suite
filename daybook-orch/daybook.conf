# DAYBOOK · 起居注体例发行版 · 司南（daybook-orch）包样板 conf
# DAYBOOK — the daybook-format distribution · sample conf for the daybook-orch (Sinan) package
# 纯文本 · 零依赖 · 一人一账本
# Plain text · zero dependencies · one bookkeeper, one ledger
#
# 此为 daybook-orch（司南）包内置样板·非生产真账（#314-C）。
# Bundled sample for the daybook-orch (Sinan) package; not a production ledger (#314-C).
# 生产环境请改用真实 daybook.conf（指向你的卷文件路径）。
# In production use a real daybook.conf pointing at your own volumes.
# 此样板内容卷表为空：编排七卷仍按下列默认文件名落在本 conf 所在根；
# digest 无内容卷时明确报 no-volumes（不再把「0 条」伪装成「没有新条」）。
# The content volume table is empty: the seven orchestration volumes use the defaults below,
# resolved against the root holding this conf; digest reports no-volumes explicitly
# instead of disguising "0 rows" as "nothing new".
#
# ★ 标识符一律英文（canonical）；旧中文名仍作**兼容别名**照旧可用，对照表见 I18N.md。
# ★ Identifiers are English (canonical); Chinese legacy names still work as aliases (see I18N.md).

[volumes]
# 编排中心（orch）七卷：不写则用下列默认文件名，全部相对本 conf 所在根解析。
# The seven orchestration volumes: when absent the defaults below are used,
# resolved relative to the root holding this conf.
# 键为内部卷角色（中文旧写法 注册卷=/任务卷=… 亦认）；同段其它键仍是 daybook 内容卷。
# Keys are internal volume roles (Chinese legacy forms 注册卷=/任务卷=… are accepted);
# other keys in this section remain daybook content volumes.
#    registry=注册卷.txt
#    tasks=任务卷.txt
#    heartbeat=心跳卷.txt
#    leases=租约卷.txt
#    ledger=编排卷.txt
#    inbox=消息卷.txt
#    locks=.locks
#
# 内容卷表为空·不绑任何真实卷；digest 报 no-volumes 并告警（不是静默 0 条）。
# The content volume table is empty on purpose; digest reports no-volumes with a warning.
# 本包已随附 sample/ 三卷假条目（每卷 5 条·发布必备件）——想立刻看到效果，
# 就把下面三行取消注释：
# The package ships three sample volumes (5 entries each). Uncomment to see it work:
#   协作=sample/协作卷.txt
#   语汇=sample/语汇卷.txt
#   百科=sample/百科卷.txt
# 生产用法：在此登记你自己的卷·格式 卷名=路径（相对此目录或绝对路径）
# Production: register your own volumes as name=path (relative or absolute)
#   你的卷=~/your_journal.txt

[entries]
# 条目头格式（正则）。默认匹配 [YYYY-MM-DD HH:MM] 或 [YYYY-MM-DD HH:MM:SS]（秒可选）
# Entry head pattern (regex). Default matches [YYYY-MM-DD HH:MM] or [YYYY-MM-DD HH:MM:SS] (seconds optional)
# 可选 [#N] 条号前缀（形如 [#123] [2026-10-09 09:00] [类] [标题]）
# Optional [#N] prefix, e.g. [#123] [2026-10-09 09:00] [category] [title]
head_regex=^(?:\[#\d+\][ ]*)?\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}(?::\d{2})?)\]
extra_head_regex=
# 标签格式（正则）★ 作者可选：四段 [时间][类][标题][作者]，第 4 段可省（兼容旧三段）
# Tag pattern (regex) ★ author optional: 4 parts, the last one may be omitted
tag_regex=^(?:\[#\d+\][ ]*)?\[\d{4}[^\]]*\][ ]*\[([^\]]+)\][ ]*\[([^\]]*)\](?:[ ]*\[([^\]]*)\])?
fields=volume,line,time,category,title,author

[rules]
# tag:N 取第 N 组｜len 字数｜count:X 次数｜contains:X｜depth 层数｜head 标题文字
category=tag:1
title=tag:2
author=tag:3

[index]
# 根目录：卷路径相对此目录解析（空=本目录；..=上一级；绝对=原样）
# Root: volume paths resolve against it (empty = here, '..' = parent, absolute = as-is)
root=
out_dir=
index_prefix=index_
manifest=volumes.md

[trigger]
auto_index=是
# 增量索引：未变跳过、只追加读尾部、旧部分被改报违例
# Incremental: skip unchanged, tail-read on append, flag violations
incremental=是

[multilevel]
# 四库式多级目录（部→类→属）：`daybook.py multiindex` 手工生成；
# watch 模式卷变动后自动续建（不要自动=否）。派生件·可删可重建·不碰账。
# Four-branch multilevel catalogue: run `daybook.py multiindex` by hand, or let
# watch rebuild it on change. Derived data: deletable and rebuildable.
multilevel_enabled=是
# 多级目录输出目录（相对根；空=<根>/multilevel）
# Catalogue output directory (relative to root; empty = <root>/multilevel)
out_dir=
# 二级分组键：category（默认·子）｜author（集）
# Level-2 grouping field: category (default) or author
level2_field=category

[hooks]
# 本包样板不挂变动令·生产请按需配置
# No on-change command in this sample; configure one in production if needed
on_change=
