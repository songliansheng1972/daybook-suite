# daybook · 编排中心 · 路由表
# ────────────────────────────────────────────────────────────
# 一行一规则：类[：关键词] = 角色
#   · 类      条目头第三段（如 工/报/审/订）
#   · 关键词  可省；命中标题或正文子串才生效（同一类按文件顺序，后者覆盖前者）
#   · 角色    见 orchestration_roles.conf
# 路由只读**条头字段**，绝不读正文语义做推理。同一条，任何时刻算得同一个下一手。
# ────────────────────────────────────────────────────────────
# 开单 → 施工组
工=施工
# 交活(报) → 复审（非作者）
报=复审
# 报条命中「驳回/返工」→ 回施工组
报:驳回=返工
报:返工=返工
# 裁决(审) → 终审
审=终审
# 审条命中「驳回」→ 回施工组返工
审:驳回=返工
# 裁 → 广播（交老宋）
裁=广播
