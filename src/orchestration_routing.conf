# daybook · 编排中心 · 路由表
# daybook · orchestration hub · routing table
# ────────────────────────────────────────────────────────────
# 一行一规则：类[：关键词] = 角色
# One rule per line: category[:keyword] = role
#   · 类      条目头第三段（如 工/报/审/订）
#             category — the third segment of the entry head (e.g. 工/报/审/订)
#   · 关键词  可省；命中标题或正文子串才生效（同一类按文件顺序，后者覆盖前者）
#             keyword — optional; matches only when it occurs in title or body
#             (same category: later lines override earlier ones)
#   · 角色    见 orchestration_roles.conf（英文角色名，中文兼容）
#             role — see orchestration_roles.conf (English names, Chinese aliases ok)
# 路由只读**条头字段**，绝不读正文语义做推理。同一条，任何时刻算得同一个下一手。
# Routing reads **entry-head fields** only; it never infers from body semantics.
# The same entry always resolves to the same next hand.
# ────────────────────────────────────────────────────────────
# 开单 → 施工组 / ticket opened → build pool
工=build
# 交活(报) → 复审（非作者）/ hand-off (report) → review (non-author)
报=review
# 报条命中「驳回/返工」→ 回施工组 / report hits "reject/rework" → back to build
报:驳回=rework
报:返工=rework
# 裁决(审) → 终审 / verdict (review) → final
审=final
# 审条命中「驳回」→ 回施工组返工 / review hits "reject" → build rework
审:驳回=rework
# 裁 → 广播（交老宋）/ ruling → broadcast (to the lead)
裁=broadcast
