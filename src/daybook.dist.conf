# DAYBOOK · 起居注体例发行版
# DAYBOOK — the daybook-format distribution
# 纯文本 · 零依赖 · 一人一账本
# Plain text · zero dependencies · one bookkeeper, one ledger
#
# 这是**发行版**用的配置：卷表只挂随包的 sample/ 三卷假条目，
# 所以解压后直接 `python3 daybook.py index` 就能看到 15 条样本。
# This is the distribution conf: the volume table points only at the three bundled
# sample volumes, so `python3 daybook.py index` shows 15 sample entries right away.
# 换你自己的账本，把下面 [volumes] 里的路径改掉即可（相对本目录或绝对路径都行）。
# Swap in your own volumes by editing the paths below (relative or absolute).
# 一台机器可挂任意多卷；卷按人分，索引统一。
# Any number of volumes per machine; volumes are per person, one unified index.
#
# ★ 标识符一律英文（canonical）；旧中文名仍作**兼容别名**照旧可用，对照表见 I18N.md。
# ★ Identifiers are English (canonical); Chinese legacy names still work as aliases (see I18N.md).

[volumes]
协作=sample/协作卷.txt
语汇=sample/语汇卷.txt
百科=sample/百科卷.txt

[entries]
# 条目头格式（正则）。默认匹配 [YYYY-MM-DD HH:MM]
# Entry head pattern (regex). Default matches [YYYY-MM-DD HH:MM]
# 可选 [#N] 条号前缀，例如 [#123] [2026-10-09 09:00] [类] [标题]
# Optional [#N] prefix, e.g. [#123] [2026-10-09 09:00] [category] [title]
head_regex=^(?:\[#\d+\][ ]*)?\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\]
# 附头：让 Markdown 标题（## 等）也成条目（可删）。
# Extra heads: let Markdown headings become entries (safe to delete).
# 注意：若你的卷正文里含大量 ## 标题，开了会把它们都切成条目，按需开。
# Note: if your volume body carries many ## headings, enabling this cuts them all
# into entries; turn it on only when that is what you want.
extra_head_regex=
# 标签格式（正则）★ 作者可选：四段 [时间][类][标题][作者]，第 4 段可省（兼容旧三段）
# Tag pattern (regex) ★ author optional: 4 parts, the last one may be omitted
tag_regex=^(?:\[#\d+\][ ]*)?\[\d{4}[^\]]*\][ ]*\[([^\]]+)\][ ]*\[([^\]]*)\](?:[ ]*\[([^\]]*)\])?
# 客户自定字段：写一行加一列。内置名：volume/line/time
# Customer-defined fields: one line adds one column. Built-ins: volume/line/time
fields=volume,line,time,category,title,author

[rules]
# tag:N 取标签第 N 组｜len 正文字数｜count:X 出现次数｜contains:X 有则1｜depth 标题层数｜head 标题文字
# tag:N = Nth capture group | len = body length | count:X occurrences | contains:X → 0/1
# | depth = heading depth | head = heading text
category=tag:1
title=tag:2
author=tag:3

[index]
# 根目录：卷路径相对此目录解析。空=相对 daybook/ 自身；..=相对上一级目录；绝对路径=原样
# Root: volume paths resolve against it. Empty = this directory; '..' = parent; absolute = as-is
root=
out_dir=
index_prefix=index_
manifest=volumes.md

[trigger]
auto_index=是
# 增量索引：未变跳过、只追加读尾部、旧部分被改报违例（append-only 守门人）
# Incremental: skip unchanged, tail-read on append, flag violations (append-only gatekeeper)
incremental=是

[multilevel]
# 四库式多级目录（部→类→属）：`daybook.py multiindex` 手工生成；
# watch 模式卷变动后自动续建（不要自动=否）。派生件·可删可重建·不碰账。
# Four-branch multilevel catalogue: run `daybook.py multiindex` by hand, or let watch
# rebuild it on change. Derived data: deletable and rebuildable.
multilevel_enabled=是
# 多级目录输出目录（相对根；空=<根>/multilevel）
# Catalogue output directory (relative to root; empty = <root>/multilevel)
out_dir=
# 二级分组键：category（默认·子）｜author（集）
# Level-2 grouping field: category (default) or author
level2_field=category

[hooks]
# watch 模式：卷变动并完成索引/备份后执行（确定性自动化·人可读可改·失败不挡游标）。
# watch mode: runs after a volume change is indexed and backed up; never blocks the cursor.
# 发行版默认不挂任何外部命令（空=不执行）。要挂就填自己的命令，例如：
# The distribution ships no command (empty = nothing runs). Add your own, e.g.:
#   on_change = python3 /path/to/your_notify.py --notify
on_change=
