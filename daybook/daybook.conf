# DAYBOOK · 起居注体例发行版
# 纯文本 · 零依赖 · 一人一账本
#
# 这是**发行版**用的配置：卷表只挂随包的 sample/ 三卷假条目，
# 所以解压后直接 `python3 daybook.py index` 就能看到 15 条样本。
# 换你自己的账本，把下面 [卷] 里的路径改掉即可（相对本目录或绝对路径都行）。
# 一台机器可挂任意多卷；卷按人分，索引统一。

[卷]
协作=sample/协作卷.txt
语汇=sample/语汇卷.txt
百科=sample/百科卷.txt

[条目]
# 条目头格式（正则）。默认匹配 [YYYY-MM-DD HH:MM]
# 可选 [#N] 条号前缀，例如 [#123] [2026-10-09 09:00] [类] [标题]
头正则=^(?:\[#\d+\][ ]*)?\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\]
# 附头：让 Markdown 标题（## 等）也成条目（可删）。
# 注意：若你的卷正文里含大量 ## 标题，开了会把它们都切成条目，按需开。
附头正则=
# 标签格式（正则）★ 作者可选：四段 [时间][类][标题][作者]，第 4 段可省（兼容旧三段）
标正则=^(?:\[#\d+\][ ]*)?\[\d{4}[^\]]*\][ ]*\[([^\]]+)\][ ]*\[([^\]]*)\](?:[ ]*\[([^\]]*)\])?
# 客户自定字段：写一行加一列。内置名：卷/行号/时间
字段=卷,行号,时间,类,标题,作者

[规则]
# tag:N 取标签第 N 组｜len 正文字数｜count:X 出现次数｜contains:X 有则1｜depth 标题层数｜head 标题文字
类=tag:1
标题=tag:2
作者=tag:3

[索引]
# 根目录：卷路径相对此目录解析。空=相对 daybook/ 自身；..=相对上一级目录；绝对路径=原样
根=
输出目录=
索引前缀=索引_
清单名=volumes.md

[触发]
自动索引=是
# 增量索引：未变跳过、只追加读尾部、旧部分被改报违例（append-only 守门人）
增量索引=是

[钩子]
# watch 模式：卷变动并完成索引/备份后执行（确定性自动化·人可读可改·失败不挡游标）。
# 发行版默认不挂任何外部命令（空=不执行）。要挂就填自己的命令，例如：
#   变动令 = python3 /path/to/your_notify.py --notify
变动令=
